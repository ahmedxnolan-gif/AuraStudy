<!DOCTYPE html>
<html lang="en" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuraStudy – AI Cyber Tutor</title>
<meta name="description" content="Upload a lecture, notes, or images and get an advanced AI study tutor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
  --bg-dark: #050811;
  --panel: rgba(13, 20, 36, 0.75);
  --border: rgba(0, 240, 255, 0.25);
  --cyan: #00f0ff;
  --pink: #ff0055;
  --purple: #7000ff;
  --text-main: #e2e8f0;
  --text-muted: #64748b;
}

body {
  background: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(112, 0, 255, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
}

h1, h2, h3, .cyber-font {
  font-family: 'Orbitron', sans-serif;
  letter-spacing: 0.05em;
}

.glass-panel {
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0, 240, 255, 0.03);
  border-radius: 0.75rem;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.btn-cyber {
  background: linear-gradient(135deg, rgba(112, 0, 255, 0.8), rgba(0, 240, 255, 0.8));
  color: #fff;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  border: 1px solid var(--cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
  transition: all 0.2s ease;
}

.btn-cyber:hover:not(:disabled) {
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.7), 0 0 10px rgba(255, 0, 85, 0.5);
  transform: translateY(-1px);
}

.btn-cyber:disabled {
  opacity: 0.5;
  cursor: wait;
}

.field-cyber {
  background: rgba(4, 8, 18, 0.8);
  border: 1px solid var(--border);
  color: var(--cyan);
  border-radius: 0.5rem;
  padding: 0.6rem 0.9rem;
  font-size: 0.875rem;
}

.field-cyber:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
}

.seg-btn {
  background: rgba(10, 16, 30, 0.6);
  border: 1px solid var(--border);
  color: var(--text-muted);
  transition: all 0.2s ease;
}

.seg-btn.on {
  background: rgba(0, 240, 255, 0.15);
  color: var(--cyan);
  border-color: var(--cyan);
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
}

.md h1, .md h2, .md h3 { color: var(--cyan); margin: 1.2em 0 0.4em; }
.md h2 { border-bottom: 1px dashed var(--border); padding-bottom: 0.3em; }
.md code { background: rgba(0, 240, 255, 0.1); color: var(--pink); padding: 0.2em 0.4em; border-radius: 4px; }
.md pre { background: #02040a; border: 1px solid var(--border); padding: 1em; border-radius: 8px; }
.md strong { color: var(--cyan); text-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }
</style>
</head>
<body class="p-4 md:p-6">

<header class="max-w-5xl mx-auto mb-6 flex justify-between items-center glass-panel px-6 py-4">
  <h1 class="text-xl md:text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-500">
    ⚡ AURA_STUDY // AI TUTOR
  </h1>
  <div class="text-xs text-cyan-400 tracking-widest border border-cyan-500/30 px-3 py-1 rounded-full bg-cyan-950/40">
    SYSTEM ONLINE // SECURED BACKEND
  </div>
</header>

<main class="max-w-5xl mx-auto space-y-6">
  <!-- Control Center Panel -->
  <section class="glass-panel p-6 space-y-5">
    <div class="flex flex-wrap gap-4 items-center justify-between">
      <div class="flex gap-2">
        <button class="mode seg-btn px-4 py-2 rounded-lg text-sm font-semibold" data-m="guide">📖 STUDY GUIDE</button>
        <button class="mode seg-btn px-4 py-2 rounded-lg text-sm font-semibold" data-m="quiz">🧠 CYBER QUIZ</button>
      </div>

      <div class="flex gap-2">
        <button class="tab seg-btn px-3 py-1.5 rounded-md text-xs" data-t="pdf">PDF FILE</button>
        <button class="tab seg-btn px-3 py-1.5 rounded-md text-xs" data-t="text">RAW TEXT</button>
      </div>
    </div>

    <!-- PDF Drag Drop Area -->
    <div id="panePdf">
      <label id="drop" class="border-2 border-dashed border-cyan-500/30 hover:border-cyan-400 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition bg-black/40">
        <span class="font-semibold text-cyan-300" id="dropLabel">DROP LECTURE PDF HERE OR CLICK TO BROWSE</span>
        <span class="text-xs text-slate-400 mt-2">Supports PDFs up to 18 MB</span>
        <input id="file" type="file" accept="application/pdf" class="hidden">
      </label>
    </div>

    <!-- Text Area Input -->
    <div id="paneText" class="hidden">
      <textarea id="text" rows="6" placeholder="Paste lecture notes or text content here..." class="field-cyber w-full"></textarea>
    </div>

    <!-- Image Upload Bar (Camera/Gallery) -->
    <div class="flex flex-wrap items-center gap-4 pt-2 border-t border-slate-800">
      <label class="btn-cyber px-4 py-2 text-xs rounded-lg cursor-pointer flex items-center gap-2">
        📷 ADD IMAGE (GALLERY / CAMERA)
        <input id="imgFile" type="file" accept="image/*" class="hidden">
      </label>
      
      <div id="imgPreviewBox" class="hidden flex items-center gap-3 bg-black/60 px-3 py-1.5 rounded-lg border border-cyan-500/30">
        <img id="imgPreview" class="w-10 h-10 object-cover rounded border border-cyan-400">
        <button id="removeImg" class="text-xs text-pink-500 hover:underline">REMOVE</button>
      </div>
    </div>

    <!-- Quiz Config Controls -->
    <div id="quizCtl" class="hidden flex-wrap gap-4 text-xs">
      <label class="flex items-center gap-2">COUNT: 
        <select id="qCount" class="field-cyber py-1"><option>5</option><option selected>10</option><option>15</option></select>
      </label>
      <label class="flex items-center gap-2">TYPE: 
        <select id="qType" class="field-cyber py-1"><option value="mcq">MCQ</option><option value="tf">True/False</option></select>
      </label>
      <label class="flex items-center gap-2">LEVEL: 
        <select id="qLevel" class="field-cyber py-1">
          <option value="easy">EASY</option><option value="medium" selected>MEDIUM</option>
          <option value="hard">HARD</option><option value="legendary">LEGENDARY 🔥</option>
        </select>
      </label>
    </div>

    <!-- Language & Submit Section -->
    <div class="flex flex-wrap items-center justify-between gap-4 pt-2">
      <div class="flex gap-2">
        <button class="lang seg-btn px-3 py-1.5 rounded-md text-xs" data-l="en">English</button>
        <button class="lang seg-btn px-3 py-1.5 rounded-md text-xs" data-l="ar-eg">عامية مصرية</button>
        <button class="lang seg-btn px-3 py-1.5 rounded-md text-xs" data-l="ar-msa">فصحى</button>
      </div>
      
      <button id="go" class="btn-cyber px-6 py-2.5 rounded-lg text-sm">INITIALIZE PROCESS</button>
    </div>
    
    <p id="status" class="text-xs text-cyan-400 min-h-[1.2rem]"></p>
  </section>

  <!-- Output & Result Section -->
  <section id="result" class="glass-panel p-6 hidden">
    <article id="summary" class="md space-y-4"></article>
  </section>

  <!-- Quiz Box -->
  <section id="quizBox" class="glass-panel p-6 hidden">
    <div id="qMeta" class="text-xs text-cyan-400 mb-4"></div>
    <div id="score" class="hidden mb-5 p-4 rounded-lg bg-black/50 border border-cyan-500/40 text-center"></div>
    <div id="qList" class="space-y-6"></div>
    <div class="flex gap-3 mt-6">
      <button id="submitQuiz" class="btn-cyber px-5 py-2 text-xs rounded">SUBMIT ANSWERS</button>
      <button id="retake" class="seg-btn px-5 py-2 text-xs rounded hidden">RETAKE</button>
    </div>
  </section>

  <!-- Chat System -->
  <section id="chat" class="glass-panel p-6 hidden space-y-4">
    <h2 class="text-lg font-bold text-cyan-400">💬 ASK CYBER TUTOR</h2>
    <div id="log" class="space-y-3 max-h-96 overflow-y-auto p-2"></div>
    <div class="flex gap-2">
      <input id="q" type="text" placeholder="Ask questions about the uploaded material..." class="field-cyber flex-1">
      <button id="send" class="btn-cyber px-5 py-2 text-xs rounded">SEND</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let state = { tab:'pdf', lang:'en', mode:'guide', history:[], summary:'', hasGuide:false, ready:false, quiz:null, picks:[], level:'medium', qlang:'en' };
let pdfData = null, imageData = null;

function setTab(t){
  state.tab = t;
  $('panePdf').classList.toggle('hidden', t !== 'pdf');
  $('paneText').classList.toggle('hidden', t !== 'text');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.t));

function setLang(l){
  state.lang = l;
  document.querySelectorAll('.lang').forEach(b => b.classList.toggle('on', b.dataset.l === l));
}
document.querySelectorAll('.lang').forEach(b => b.onclick = () => setLang(b.dataset.l));

function setMode(m){
  state.mode = m;
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('quizCtl').classList.toggle('hidden', m !== 'quiz');
  $('go').textContent = m === 'quiz' ? 'GENERATE QUIZ' : 'CREATE STUDY GUIDE';
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.m));

$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { pdfData = r.result.split(',')[1]; $('dropLabel').textContent = f.name; };
  r.readAsDataURL(f);
};

$('imgFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    imageData = { inlineData: { mimeType: f.type, data: r.result.split(',')[1] } };
    $('imgPreview').src = r.result;
    $('imgPreviewBox').classList.remove('hidden');
  };
  r.readAsDataURL(f);
};

$('removeImg').onclick = () => {
  imageData = null;
  $('imgFile').value = '';
  $('imgPreviewBox').classList.add('hidden');
};

async function callBackend(contents, systemPrompt, onText) {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, systemInstruction: systemPrompt })
  });

  if (!response.ok) throw new Error('Backend error processing your request.');

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value);
    fullText += chunk;
    if (onText) onText(fullText);
  }
  return fullText;
}

$('go').onclick = async () => {
  const parts = [];
  if (state.tab === 'pdf' && pdfData) parts.push({ inlineData: { mimeType: 'application/pdf', data: pdfData } });
  if (state.tab === 'text' && $('text').value) parts.push({ text: $('text').value });
  if (imageData) parts.push(imageData);

  if (!parts.length) return alert('Please upload a PDF, paste text, or attach an image.');

  $('status').textContent = 'Processing request via backend...';
  $('result').classList.remove('hidden');
  
  try {
    const text = await callBackend(
      [{ role: 'user', parts }],
      'You are a high-tech AI study assistant. Explain concepts clearly with Markdown formatting.',
      t => { $('summary').innerHTML = t; }
    );
    $('status').textContent = 'Completed successfully ✓';
  } catch (err) {
    $('status').textContent = err.message;
  }
};
</script>
</body>
</html>

export default async function handler(req, res) {
  if (req.method !== 'POST') {
    return res.status(405).json({ error: 'Method not allowed' });
  }

  try {
    const { contents, systemInstruction } = req.body;

    const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
    const model = genAI.getGenerativeModel({
      model: 'gemini-1.5-flash',
      systemInstruction: systemInstruction || 'You are an AI study assistant.'
    });

    res.setHeader('Content-Type', 'text/plain; charset=utf-8');
    res.setHeader('Transfer-Encoding', 'chunked');

    const result = await model.generateContentStream({ contents });

    for await (const chunk of result.stream) {
      const chunkText = chunk.text();
      res.write(chunkText);
    }

    res.end();
  } catch (error) {
    console.error('API Error:', error);
    res.status(500).json({ error: 'Internal Server Error' });
  }
}
