<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Language Study Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Generative Language Study Tool</h1>
            <button id="settingsBtn">Settings</button>
        </header>
        <div id="settings" class="hidden">
            <h2>Settings</h2>
            <label for="apiKey">API Key:</label>
            <input type="text" id="apiKey" placeholder="Enter your API Key">
            <button id="saveKey">Save Key</button>
        </div>
        <div id="log"></div>
        <textarea id="text" placeholder="Type your message here..."></textarea>
        <button id="send">Send</button>
        <button id="clear">Clear</button>
        <button id="guide">Guide Mode</button>
        <button id="quiz">Quiz Mode</button>
        <button id="download">Download Study Guide</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
