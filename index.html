<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraStudy</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3333ff;
            --secondary-color: #6666ff;
            --accent-color: #00ffff;
            --background-color: #121212;
            --text-color: #ffffff;
            --error-color: #ff6666;
            --success-color: #66ff66;
        }
        .glassmorphism {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }
        .neon-text {
            background-color: rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 2px 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .interactive-ai {
            background-color: rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        .scrollbar-custom::-webkit-scrollbar {
            width: 10px;
        }
        .scrollbar-custom::-webkit-scrollbar-track {
            background: #121212;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: #6666ff;
            border-radius: 5px;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb:hover {
            background: #3333ff;
        }
    </style>
</head>
<body class="bg-background-color text-text-color font-sans scrollbar-custom">
    <div class="container mx-auto p-6">
        <div class="flex justify-center">
            <h1 class="text-4xl font-bold glassmorphism">AuraStudy</h1>
        </div>
        <div class="mt-8">
            <div class="text-2xl font-bold glassmorphism">Upload Study Material</div>
            <div class="mt-4">
                <input type="file" id="fileInput" class="file-input" accept=".pdf, .txt, .docx">
            </div>
        </div>
        <div class="mt-8">
            <div class="text-2xl font-bold glassmorphism">Text Input</div>
            <div class="mt-4">
                <textarea id="textInput" class="w-full h-40 bg-background-color text-text-color border-2 border-primary-color rounded-lg p-4"></textarea>
            </div>
        </div>
        <div class="mt-8">
            <div class="text-2xl font-bold glassmorphism">Summarize File / Text</div>
            <div class="mt-4 flex items-center">
                <button id="summarizeBtn" class="btn">Summarize</button>
                <select id="languageSelect" class="ml-4">
                    <option value="en">English (Professional)</option>
                    <option value="egy">Egyptian Arabic</option>
                </select>
            </div>
        </div>
        <div class="mt-8">
            <div class="text-2xl font-bold glassmorphism">Generate Quiz</div>
            <div class="mt-4 flex items-center">
                <button id="generateQuizBtn" class="btn">Generate Quiz</button>
                <select id="quizTypeSelect" class="ml-4">
                    <option value="mcq">Multiple Choice Questions (MCQ / اختياري)</option>
                    <option value="essay">Essay Questions (مقالي)</option>
                    <option value="tf">True / False (صح وغلط)</option>
                </select>
                <input type="number" id="numQuestionsInput" class="ml-4 px-2 py-1 bg-background-color text-text-color border-2 border-primary-color rounded-lg" value="5">
            </div>
        </div>
        <div class="mt-8">
            <div class="text-2xl font-bold glassmorphism">Output Workspace</div>
            <div class="mt-4">
                <div id="outputArea" class="w-full h-40 bg-background-color text-text-color border-2 border-primary-color rounded-lg p-4 overflow-y-auto"></div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('summarizeBtn').addEventListener('click', () => {
            const fileInput = document.getElementById('fileInput');
            const textInput = document.getElementById('textInput');
            const languageSelect = document.getElementById('languageSelect');
            const outputArea = document.getElementById('outputArea');

            if (fileInput.files.length > 0) {
                // Handle PDF text reading fallback
                const reader = new FileReader();
                reader.onload = (e) => {
                    summarizeText(e.target.result, languageSelect.value, outputArea);
                };
                reader.readAsText(fileInput.files[0]);
            } else if (textInput.value.trim() !== '') {
                summarizeText(textInput.value, languageSelect.value, outputArea);
            } else {
                alert('Please upload a file or enter text to summarize.');
            }
        });

        document.getElementById('generateQuizBtn').addEventListener('click', () => {
            const quizTypeSelect = document.getElementById('quizTypeSelect');
            const numQuestionsInput = document.getElementById('numQuestionsInput');
            const outputArea = document.getElementById('outputArea');

            const quizType = quizTypeSelect.value;
            const numQuestions = parseInt(numQuestionsInput.value, 10);
            if (isNaN(numQuestions) || numQuestions <= 0) {
                alert('Please enter a valid number of questions.');
                return;
            }
            generateQuiz(quizType, numQuestions, outputArea);
        });

        function summarizeText(text, language, outputArea) {
            // Mock function to simulate text summarization
            outputArea.textContent = `Summarized text in ${language}:\n${text}`;
        }

        function generateQuiz(quizType, numQuestions, outputArea) {
            // Mock function to simulate quiz generation
            const quiz = [];
            for (let i = 1; i <= numQuestions; i++) {
                quiz.push({
                    question: `Question ${i}`,
                    answer: `Answer ${i}`
                });
            }
            outputArea.textContent = `Generated ${quizType} quiz with ${numQuestions} questions:\n${JSON.stringify(quiz, null, 2)}`;
        }
    </script>
</body>
</html>
