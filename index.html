<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Chat App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // IndexedDB helper functions
    const idb = {
      open: () => {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("pdf-chat", 1);
          request.onupgradeneeded = () => {
            request.result.createObjectStore("pdf", { keyPath: "id" });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      },
      set: (store, data) => {
        return idb.open().then(db => {
          return new Promise((resolve, reject) => {
            const transaction = db.transaction([store], "readwrite");
            const storeRef = transaction.objectStore(store);
            const request = storeRef.put({ id: "pdf", ...data });
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
          });
        });
      },
      get: (store) => {
        return idb.open().then(db => {
          return new Promise((resolve, reject) => {
            const transaction = db.transaction([store], "readonly");
            const storeRef = transaction.objectStore(store);
            const request = storeRef.get("pdf");
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        });
      }
    };

    // Global variable to hold PDF content
    let pdfData;
  </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
  <header class="bg-white shadow-md p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">PDF Chat App</h1>
    <div class="flex space-x-2">
      <input type="file" id="pdfUpload" accept="application/pdf" class="hidden" />
      <label for="pdfUpload" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 cursor-pointer">
        Upload PDF
      </label>
      <button id="chatButton" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        Start Chat
      </button>
    </div>
  </header>

  <main class="flex-1 p-6">
    <div id="dropZone" class="border-2 border-dashed border-gray-400 p-10 text-center cursor-pointer hover:border-blue-500 rounded-lg mb-6">
      <p id="dropLabel" class="text-gray-600">Drag and drop a PDF here, or click to upload</p>
    </div>

    <div id="chatContainer" class="hidden bg-white p-4 rounded-lg shadow-sm h-96 overflow-y-auto">
      <div id="messages" class="space-y-4"></div>
    </div>
  </main>

  <script>
    // Drag and drop handling
    const dropZone = document.getElementById("dropZone");
    const dropLabel = document.getElementById("dropLabel");
    const chatContainer = document.getElementById("chatContainer");
    const messages = document.getElementById("messages");
    const chatButton = document.getElementById("chatButton");

    // Initialize chat
    function initChat() {
      chatContainer.classList.remove("hidden");
      messages.innerHTML = "";
      const message = document.createElement("div");
      message.classList.add("bg-blue-100", "p-3", "rounded-lg", "text-blue-800");
      message.textContent = "Welcome! You can now chat with the uploaded PDF.";
      messages.appendChild(message);
    }

    // Handle file upload via drop zone
    function upload(event) {
      event.preventDefault();
      const file = event.dataTransfer.files[0];
      if (!file || !file.type.startsWith("application/pdf")) return;

      const reader = new FileReader();
      reader.onload = e => {
        const data = e.target.result;
        idb.set("pdf", { data: data, name: file.name }).then(() => {
          dropLabel.textContent = file.name + " (saved)";
        });
      };
      reader.readAsArrayBuffer(file);
    }

    // Handle file upload via input button
    document.getElementById("pdfUpload").addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (!file || !file.type.startsWith("application/pdf")) return;

      const reader = new FileReader();
      reader.onload = e => {
        const data = e.target.result;
        idb.set("pdf", { data: data, name: file.name }).then(() => {
          dropLabel.textContent = file.name + " (saved)";
        });
      };
      reader.readAsArrayBuffer(file);
    });

    // Restore PDF on page load
    window.addEventListener("load", async () => {
      try {
        const pdf = await idb.get("pdf");
        if (pdf && pdf.data) {
          pdfData = pdf.data;
          dropLabel.textContent = pdf.name + " (saved)";
        }
      } catch (e) {
        console.error("Failed to restore PDF:", e);
      }
    });

    // Strip history function (placeholder replacement)
    function stripHist(h) {
      return h.map(t => ({
        role: t.role,
        parts: t.parts.map(p => p.inlineData ? { text: "__PDF__" } : p)
      }));
    }

    // Chat button click
    chatButton.addEventListener("click", initChat);

    // Drop zone event listeners
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("bg-blue-50");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("bg-blue-50");
    });

    dropZone.addEventListener("drop", upload);
    dropZone.addEventListener("click", () => {
      document.getElementById("pdfUpload").click();
    });
  </script>
</body>
</html>
